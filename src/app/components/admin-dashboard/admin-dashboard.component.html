<div class="dashboard-container">
  <div class="dashboard-heading">
    <div>
      <h1>{{ title }}</h1>
      <p>Bienvenue sur le tableau de bord de l'administration.</p>
    </div>
    <a mat-raised-button color="primary" routerLink="/referrals">+ Add Referral</a>
  </div>
</div>

<div class="dashboard-container">
  <div class="stats">
    <div class="stat-card">
      <h2>Utilisateurs Actifs</h2>
      <p>250</p>
    </div>
    <div class="stat-card referral-card" routerLink="/referrals" tabindex="0">
      <h2>Referral Management</h2>
      <p>Intake · disposition · survey log</p>
    </div>
    <div class="stat-card">
      <h2>Rapports en Attente</h2>
      <p>45</p>
    </div>
    <div class="stat-card">
      <h2>Nouvelles Inscriptions</h2>
      <p>30</p>
    </div>
  </div>
</div>

<div class="dashboard-container">
  <h1>Tableau de bord Admin</h1>
  <div class="chart-container">
    <canvas #barChart></canvas>
  </div>
</div>
