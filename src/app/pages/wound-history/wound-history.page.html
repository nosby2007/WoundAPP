<!-- src/app/pages/wound-history/wound-history.page.html -->
<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button (click)="backToList()">Back</ion-back-button>
    </ion-buttons>
    <ion-title>Wound history</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div style="padding: 12px;">
    <ion-button expand="block" (click)="newAssessmentForThisWound()">
      + New assessment for this wound
    </ion-button>
  </div>

  <div *ngIf="loading" style="display:flex; justify-content:center; margin-top:24px;">
    <ion-spinner name="crescent"></ion-spinner>
  </div>

  <ion-list *ngIf="!loading">
    <ion-item
      button
      *ngFor="let a of (items$ | async) || []"
      (click)="openAssessment(a)"
    >
      <ion-label>
        <h2>
          {{ a.assessedAt | date:'short' }} •
          {{ a.status | titlecase }}
        </h2>
        <p>
          {{ a.type }} – {{ a.location }}
          <span *ngIf="a.stage"> (Stage {{ a.stage }})</span>
        </p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
