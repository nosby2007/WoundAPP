# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # The unit suite had never run: it did not compile, and once it did
      # every generated page spec failed for want of an ActivatedRoute.
      # Running it here is the only thing that keeps it from drifting back.
      - name: Unit tests
        run: npm run test:ci
      - name: Verify staff onboarding and persisted session
        run: node scripts/verify-staff-onboarding-session.js
      - name: Verify mobile claims preflight
        run: node scripts/verify-mobile-claims-preflight.js
      - name: Verify mobile provider order guidance
        run: node scripts/verify-mobile-order-guidance.js
      - name: Verify clinical sync queue contract
        run: node scripts/verify-clinical-sync-queue.js
      - name: Verify visit execution hardening
        run: node scripts/verify-visit-execution-hardening.js
      - name: Verify Scheduler → WoundAPP field authority
        run: node scripts/verify-scheduler-field-authority.js
      - name: Verify mobile checkout recovery
        run: node scripts/verify-mobile-checkout-recovery.js
      - name: Verify professional visit packet
        run: node scripts/verify-professional-visit-packet.js
      - name: Build actual Ionic WoundAPP against DEV Firebase
        run: npm run build -- --configuration development
      # A separate Hosting site is REQUIRED: the DEV project's default site
      # is used by JADE and must not be overwritten by WoundAPP previews.
      - name: Verify dedicated DEV mobile Hosting site
        if: ${{ vars.WOUNDAPP_DEV_HOSTING_SITE != '' }}
        env:
          MOBILE_SITE: ${{ vars.WOUNDAPP_DEV_HOSTING_SITE }}
        run: |
          test "$MOBILE_SITE" != "jade-dev-5b0e3"
          test "$MOBILE_SITE" != "innovacare-mobile"
          test "$MOBILE_SITE" != "woundapp-261e6"
          node -e 'const fs=require("fs");const f=JSON.parse(fs.readFileSync("firebase.json"));f.hosting.site=process.env.MOBILE_SITE;delete f.hosting.target;fs.writeFileSync("firebase.json",JSON.stringify(f,null,2)+"\\n")'
      - name: Deploy DEV mobile preview only to dedicated site
        if: ${{ vars.WOUNDAPP_DEV_HOSTING_SITE != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JADE_DEV_5B0E3 }}
          projectId: jade-dev-5b0e3
          channelId: pr-${{ github.event.pull_request.number }}
      - name: Dedicated DEV Hosting site not configured
        if: ${{ vars.WOUNDAPP_DEV_HOSTING_SITE == '' }}
        run: echo "::warning::Mobile DEV Hosting preview skipped until WOUNDAPP_DEV_HOSTING_SITE is configured. Build/tests still run."
