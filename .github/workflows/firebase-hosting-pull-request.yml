# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # The unit suite had never run: it did not compile, and once it did
      # every generated page spec failed for want of an ActivatedRoute.
      # Running it here is the only thing that keeps it from drifting back.
      - name: Unit tests
        run: npm run test:ci
      - name: Verify staff onboarding and persisted session
        run: node scripts/verify-staff-onboarding-session.js
      - name: Verify mobile provider order guidance
        run: node scripts/verify-mobile-order-guidance.js
      - name: Verify clinical sync queue contract
        run: node scripts/verify-clinical-sync-queue.js
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WOUNDAPP_261E6 }}
          projectId: woundapp-261e6
