# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR
on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: firebase-hosting-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      # The unit suite had never run: it did not compile, and once it did
      # every generated page spec failed for want of an ActivatedRoute.
      # Running it here is the only thing that keeps it from drifting back.
      - name: Unit tests
        run: npm run test:ci
      - name: Verify staff onboarding and persisted session
        run: node scripts/verify-staff-onboarding-session.js
      - name: Verify mobile claims preflight
        run: node scripts/verify-mobile-claims-preflight.js
      - name: Verify mobile provider order guidance
        run: node scripts/verify-mobile-order-guidance.js
      - name: Verify clinical sync queue contract
        run: node scripts/verify-clinical-sync-queue.js
      - name: Verify visit execution hardening
        run: node scripts/verify-visit-execution-hardening.js
      - name: Verify Scheduler → WoundAPP field authority
        run: node scripts/verify-scheduler-field-authority.js
      - name: Verify mobile checkout recovery
        run: node scripts/verify-mobile-checkout-recovery.js
      - name: Verify professional visit packet
        run: node scripts/verify-professional-visit-packet.js
      - name: Verify end-to-end visit chain contract
        run: node scripts/verify-visit-chain-contract.js
      - name: Build actual Ionic WoundAPP against DEV Firebase
        run: npm run build -- --configuration development
      # Dedicated mobile DEV site confirmed in Firebase Hosting.
      # Never deploy to JADE's default site or production innovacare-mobile.
      - name: Pin dedicated mobile DEV Hosting site
        run: |
          node -e 'const fs=require("fs");const f=JSON.parse(fs.readFileSync("firebase.json","utf8"));f.hosting.site="phwc-mobile-dev";delete f.hosting.target;fs.writeFileSync("firebase.json",JSON.stringify(f,null,2)+String.fromCharCode(10))'
      - name: Deploy mobile DEV preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JADE_DEV_5B0E3 }}
          projectId: jade-dev-5b0e3
          channelId: pr-${{ github.event.pull_request.number }}
