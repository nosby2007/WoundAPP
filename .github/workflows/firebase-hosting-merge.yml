# Deploys this repository -- the `wound-nurse` mobile app -- to the
# `innovacare-mobile` Hosting site.
#
# The trigger used to be `main`. This app lives on `master`; `main` holds a
# completely different application (`touch`, Angular 14) with no shared git
# history. So merging to `master` deployed nothing at all, and production kept
# serving whatever was last pushed by hand -- which is how the patient roster
# stayed broken after the fix for it had already been merged.
#
# The site is pinned in firebase.json ("site": "innovacare-mobile"), so a
# deploy from this branch cannot land on the web app's site by accident.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:
concurrency:
  group: firebase-production-innovacare-mobile
  cancel-in-progress: false
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm ci
          node scripts/verify-field-role-boundary.js
          npm run build
      - name: Verify release source and stamp build
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_BRANCH: master
          RELEASE_CHANNEL: production
        run: node scripts/verify-release-source.js

      - uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          RELEASE_COMMIT_SHA: ${{ github.sha }}
          RELEASE_BRANCH: master
          RELEASE_CHANNEL: production
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WOUNDAPP_261E6 }}
          channelId: live
          projectId: woundapp-261e6
      - name: Publish deployed commit in summary
        run: |
          echo "### WoundAPP production release" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: `${GITHUB_SHA}`" >> "$GITHUB_STEP_SUMMARY"
          echo "Hosting site: `innovacare-mobile`" >> "$GITHUB_STEP_SUMMARY"
          echo "Source guard: clean checkout + exact SHA verified" >> "$GITHUB_STEP_SUMMARY"
