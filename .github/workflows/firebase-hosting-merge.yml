# DISARMED ON PURPOSE -- do not re-add a `push:` trigger without reading this.
#
# This branch (`main`) holds the `touch` application, Angular 14. It is not the
# mobile app. The mobile app (`wound-nurse`, Ionic + Capacitor) lives on
# `master` and shares no git history with this branch.
#
# This workflow used to deploy `dist/touch` from here to
# `target: innovacare-mobile`, live, on every push to `main`. That is the
# mobile app's own Hosting site. On 2026-08-25 at 03:19 UTC it fired and
# replaced the mobile app with this one in production; the site had to be
# rolled back to version d589a81a285cac98 at 03:33 UTC to restore it.
#
# The target was never right. This project has two sites -- `woundapp-261e6`
# (the web app, deployed from the JADE-SHOP repository) and
# `innovacare-mobile` (the mobile app, deployed from `master`). Neither
# belongs to `touch`, so pointing this workflow at either one overwrites a
# different, live application.
#
# Before this is enabled again, `touch` needs a Hosting site of its own, and
# both `firebase.json` and the `target:` below have to name it. Until then it
# runs only when a person explicitly starts it from the Actions tab, so it
# cannot fire by accident.
name: Deploy to Firebase Hosting on merge
on:
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: (npm ci && npm run build)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WOUNDAPP_261E6 }}
          channelId: live
          projectId: woundapp-261e6
          target: innovacare-mobile
