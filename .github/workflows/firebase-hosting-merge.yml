# Deploys this repository -- the `wound-nurse` mobile app -- to the
# `innovacare-mobile` Hosting site.
#
# The trigger used to be `main`. This app lives on `master`; `main` holds a
# completely different application (`touch`, Angular 14) with no shared git
# history. So merging to `master` deployed nothing at all, and production kept
# serving whatever was last pushed by hand -- which is how the patient roster
# stayed broken after the fix for it had already been merged.
#
# The site is pinned in firebase.json ("site": "innovacare-mobile"), so a
# deploy from this branch cannot land on the web app's site by accident.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - master
  # So a deploy can be re-run from the Actions tab without an empty commit.
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WOUNDAPP_261E6 }}
          channelId: live
          projectId: woundapp-261e6
